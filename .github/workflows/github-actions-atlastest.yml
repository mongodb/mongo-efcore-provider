name: Test Atlas

on:
  pull_request:
    branches:
      - main
      - release/*

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test

  # EF11 builds for net11.0. Its SpecificationTests use xUnit v3 4.x (Microsoft.Testing.Platform only), which "dotnet test"
  # cannot run, so they are run through their own test host. See AGENTS.md.
  build-ef11:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      # Restore with the configuration: the restore assets are per configuration (obj/Debug EF11), so a plain
      # "dotnet restore" would restore only the default one.
      - name: Build
        run: dotnet build -c "Debug EF11"

      - name: Unit tests
        run: dotnet test tests/MongoDB.EntityFrameworkCore.UnitTests -c "Debug EF11" --no-build

      - name: Functional tests
        run: dotnet test tests/MongoDB.EntityFrameworkCore.FunctionalTests -c "Debug EF11" --no-build

      - name: Specification tests
        run: |
          dotnet "tests/MongoDB.EntityFrameworkCore.SpecificationTests/bin/Debug EF11/net11.0/MongoDB.EntityFrameworkCore.SpecificationTests.dll" -noColor -result-junit ef11-spec-results.xml
          # A misconfigured host can exit 0 having run nothing, so require the results to contain test cases.
          test_count=$(grep -o "<testcase " ef11-spec-results.xml | wc -l)
          echo "EF11 SpecificationTests reported ${test_count} test cases"
          test "${test_count}" -gt 0
